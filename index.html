  function levSet(maxL) {
    const rows = LEV_ALL.filter(function (x) { return x.lev <= maxL; });
    if (!rows.length) rows.push({ lev: Math.max(2, maxL), w: 1 });
    const top = { lev: maxL, w: 0.12 };
    if (!rows.some(function (x) { return x.lev === maxL; })) rows.push(top);
    const s = rows.reduce(function (a, x) { return a + x.w; }, 0) || 1;

  function deposit(bins, price, px, usd, side) {

    for (let i = 0; i < bins.length; i++) {
      const ok = side === "long" ? bins[i].pct < 0 : bins[i].pct > 0;
      const k = ok ? Math.exp(-0.5 * Math.pow((bins[i].pct - pct) / sigma, 2)) : 0;
      ks[i] = k;
      sum += k;
    }
    if (sum <= 1e-12) return;

  }
  function smoothKey(bins, key) {
    const src = bins.map(function (b) { return b[key]; });

      const a = src[i - 1] != null ? src[i - 1] : src[i];
      const b = src[i];
      const c = src[i + 1] != null ? src[i + 1] : src[i];
      const same = (key === "longUsd") ? (bins[i].pct < 0) : (bins[i].pct > 0);
      if (!same) continue;
      const aOk = (i > 0) && ((key === "longUsd") ? bins[i - 1].pct < 0 : bins[i - 1].pct > 0);
      const cOk = (i + 1 < bins.length) && ((key === "longUsd") ? bins[i + 1].pct < 0 : bins[i + 1].pct > 0);
      bins[i][key] = (aOk ? 0.18 * a : 0) + 0.64 * b + (cOk ? 0.18 * c : 0);

    for (let j = 0; j < idx.length; j++) {

  function estimateMap(perp) {
    const price = perp.price, oiUsd = perp.oiUsd, candles = perp.candles;
    const RANGE = rangeOf(perp.maxLeverage);
    const bins = [];
    for (let k = -RANGE / STEP; k <= RANGE / STEP; k++) {
      if (k === 0) continue;
      const pct = k * STEP;
      bins.push({ price: price * (1 + pct / 100), pct: pct, longUsd: 0, shortUsd: 0 });
    }
    const now = Date.now();
    const used = (candles || []).filter(function (c) { return (c.t || 0) > now - 72 * 3600 * 1000; });
    const rows = used.length ? used : (candles || []).slice(-72);
    const volSum = rows.reduce(function (s, c) { return s + (c.v || 0); }, 0) || 1;
    const hours = perp.fundingHours || 1;
    const f = (perp.funding || 0) / hours;
    const longW = Math.min(0.7, Math.max(0.3, 0.5 + f * 80));
    const shortW = 1 - longW;
    const levs = levCurve(perp.maxLeverage || 10);

      const mid = (lo + hi) / 2;

  }

    const hl = rows.find(function (v) { return v.ex === "hl"; });
    if (hl) return hl.price;
    let num = 0, den = 0;
    rows.forEach(function (v) { num += v.price * v.oiUsd; den += v.oiUsd; });
    return den ? num / den : rows[0].price;
  }

  function aggregateVenues(venues, enabled) {
    const primary = pickPrimary(venues, enabled);
    const price = refPriceOf(venues, enabled);
    const rows = activeVenues(venues, enabled);
    if (!price || !rows.length) {
      return { price: price, longs: [], shorts: [], bands: { 1: [0, 0], 3: [0, 0], 5: [0, 0] }, walls: [], mode: "multi-estimate", step: STEP, range: RANGE_MIN, empty: true, byEx: {}, used: [] };
    }
    const maxL = Math.max.apply(null, rows.map(function (v) { return v.maxLeverage || 10; }));
    const RANGE = rangeOf(maxL);
    const bins = [];
    for (let k = -RANGE / STEP; k <= RANGE / STEP; k++) {
      if (k === 0) continue;
      const pct = k * STEP;
      const rec = { price: price * (1 + pct / 100), pct: pct, longUsd: 0, shortUsd: 0, byEx: {} };
      EX_ORDER.forEach(function (ex) { rec.byEx[ex] = { longUsd: 0, shortUsd: 0 }; });
      bins.push(rec);
    }
    function snapAdd(px, usd, ex, key) {
      if (!(usd > 0) || !isFinite(px)) return;
      let best = 0, bestD = Infinity;
      for (let i = 0; i < bins.length; i++) {
        const d = Math.abs(bins[i].price - px);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (key === "longUsd" && bins[best].price >= price) return;
      if (key === "shortUsd" && bins[best].price <= price) return;
      bins[best][key] += usd;
      bins[best].byEx[ex][key] += usd;
    }
    rows.forEach(function (v) {
      const m = estimateMap(v);
      (m.longs || []).forEach(function (r) { snapAdd(r[0], r[1], v.ex, "longUsd"); });
      (m.shorts || []).forEach(function (r) { snapAdd(r[0], r[1], v.ex, "shortUsd"); });
    });
    const longs = bins.filter(function (b) { return b.price < price; }).map(function (b) {
      return { price: b.price, usd: b.longUsd, byEx: b.byEx };
    }).sort(function (a, b) { return b.price - a.price; });
    const shorts = bins.filter(function (b) { return b.price > price; }).map(function (b) {
      return { price: b.price, usd: b.shortUsd, byEx: b.byEx };
    }).sort(function (a, b) { return a.price - b.price; });
    const band = function (pct) {
      const lo = longs.reduce(function (s, r) { return r.price >= price * (1 - pct / 100) ? s + r.usd : s; }, 0);
      const hi = shorts.reduce(function (s, r) { return r.price <= price * (1 + pct / 100) ? s + r.usd : s; }, 0);
      return [lo, hi];
    };
    const walls = (primary && primary.book && enabled[primary.ex] !== false) ? bookWalls(primary.book, price, RANGE) : [];
    return {
      price: price,
      longs: longs,
      shorts: shorts,
      bands: { 1: band(1), 3: band(3), 5: band(5) },
      walls: walls,
      mode: "multi-estimate",
      step: STEP,
      range: RANGE,
      empty: false,
      used: rows.map(function (v) { return v.ex; }),
      primaryEx: primary ? primary.ex : null
    };
  }

  function bookWalls(book, price, rng) {
    if (!book) return [];
    const keep = function (rows, kind) {
      return rows.slice().sort(function (a, b) { return b.usd - a.usd; })
        .filter(function (x) {
          const dist = Math.abs(x.price / price - 1) * 100;
          return x.usd > 0 && dist >= 0.8 && dist <= rng;
        })
        .slice(0, 1)
        .map(function (x) { return { kind: kind, price: x.price, usd: x.usd }; });
    };
    return keep(book.bids, "bid").concat(keep(book.asks, "ask"));
  }

  function verdictOf(D) {
    const b1 = D.bands[1] || D.bands["1"];
    const lo = b1 ? b1[0] : 0, hi = b1 ? b1[1] : 0;
    if (lo > 1.8 * Math.max(hi, 1) && lo > 0) return "가까운 ±1%는 롱 청산이 더 두꺼워요. 아래로 끌릴 여지가 있어요.";
    if (hi > 1.8 * Math.max(lo, 1) && hi > 0) return "가까운 ±1%는 숏 청산이 더 두꺼워요. 위로 짧히며 오를 여지가 있어요.";
    return "가까운 ±1% 롱·숏 청산이 비슷해요. 방향이 한쪽으로 기울진 않았어요.";
  }

  function rsi(values, period) {
    period = period || 14;
    if (values.length <= period) return null;
    let gain = 0, loss = 0;
    for (let i = values.length - period; i < values.length; i++) {
      const d = values[i] - values[i - 1];
      if (d >= 0) gain += d; else loss -= d;
    }
    if (loss === 0) return 100;
    return 100 - 100 / (1 + (gain / period) / (loss / period));
  }

  function swings(candles, price) {
    const last = (candles || []).slice(-72);
    const lows = [], highs = [];
    for (let i = 2; i < last.length - 2; i++) {
      if (last[i].l <= last[i - 1].l && last[i].l <= last[i - 2].l && last[i].l <= last[i + 1].l && last[i].l <= last[i + 2].l)
        lows.push(last[i].l);
      if (last[i].h >= last[i - 1].h && last[i].h >= last[i - 2].h && last[i].h >= last[i + 1].h && last[i].h >= last[i + 2].h)
        highs.push(last[i].h);
    }
    const day = last.slice(-24);
    if (day.length) {
      lows.push(Math.min.apply(null, day.map(function (c) { return c.l; })));
      highs.push(Math.max.apply(null, day.map(function (c) { return c.h; })));
    }
    return {
      lows: lows.filter(function (x) { return x < price * 0.998; }).sort(function (a, b) { return b - a; }),
      highs: highs.filter(function (x) { return x > price * 1.002; }).sort(function (a, b) { return a - b; })
    };
  }

  function clusterPx(c) { return Array.isArray(c) ? c[0] : c.price; }
  function clusterUsd(c) { return Array.isArray(c) ? c[1] : (c.usd || 0); }
  function mergeLevels(clusters, swings, price, below) {
    const out = [];
    const near = function (a, b) { return Math.abs(a - b) / price < 0.004; };
    const add = function (px, usd, why) {
      if (!isFinite(px) || (below && px >= price) || (!below && px <= price)) return;
      for (let i = 0; i < out.length; i++) {
        if (near(out[i].price, px)) {
          if ((usd || 0) > (out[i].usd || 0)) { out[i].price = px; out[i].usd = usd; }
          if (why && out[i].why.indexOf(why) < 0) out[i].why += " · " + why;
          return;
        }
      }
      out.push({ price: px, usd: usd || 0, why: why });
    };
    const ranked = (clusters || []).slice().filter(function (c) { return clusterUsd(c) > 0; }).sort(function (a, b) { return clusterUsd(b) - clusterUsd(a); });
    ranked.slice(0, 8).forEach(function (c, i) { add(clusterPx(c), clusterUsd(c), i === 0 ? "가장 두꺼운 청산 밀집" : "청산 밀집"); });
    (swings || []).slice(0, 4).forEach(function (sv) { add(sv, 0, "최근 스윙"); });
    const byDist = out.slice().sort(function (a, b) { return Math.abs(a.price - price) - Math.abs(b.price - price); });
    const picked = [];
    const take = function (lv) {
      if (!lv) return;
      if (picked.some(function (x) { return near(x.price, lv.price); })) return;
      picked.push(lv);
    };
    byDist.slice(0, 2).forEach(take);
    if (ranked[0]) take(out.find(function (x) { return near(x.price, clusterPx(ranked[0])); }) || { price: clusterPx(ranked[0]), usd: clusterUsd(ranked[0]), why: "가장 두꺼운 청산 밀집" });
    byDist.forEach(function (lv) { if (picked.length < 3) take(lv); });
    picked.sort(function (a, b) { return below ? b.price - a.price : a.price - b.price; });
    return picked.slice(0, 3);
  }

  function buildPlan(cfg, perp, D, sibling, pack) {
    const price = perp.price;
    const d = cfg.digits;
    const sw = swings(perp.candles, price);
    const down = mergeLevels(D.longs, sw.lows, price, true);
    const up = mergeLevels(D.shorts, sw.highs, price, false);
    const closes = (perp.candles || []).map(function (c) { return c.c; });
    const r = rsi(closes, 14);
    const b1 = D.bands[1] || [0, 0];
    const longHeavy = b1[0] > 1.5 * b1[1];
    const shortHeavy = b1[1] > 1.5 * b1[0];
    const zone = function (lv, i) {
      if (!lv) return "아직 뚜렷한 " + (i + 1) + "차 자리를 잡지 못했어요.";
      const pct = ((lv.price / price - 1) * 100);
      const money = lv.usd ? " · 약 " + man(lv.usd) : "";
      return fmtPx(lv.price, d) + "달러 (" + (pct >= 0 ? "+" : "") + pct.toFixed(1) + "%" + money + ") · " + lv.why + " (추정)";
    };
    const buyLo = down[0] ? down[0].price : price * 0.99;
    const buyHi = down[0] ? Math.min(price, (down[0].price + price) / 2) : price * 0.995;
    const stopPx = down[1] ? down[1].price : (down[0] ? down[0].price * 0.99 : price * 0.97);
    const shrinkPx = up[0] ? up[0].price : price * 1.02;
    const takePx = up[1] ? up[1].price : (up[0] ? up[0].price : price * 1.04);
    let stance = "관망";
    if (r != null && r < 35 && longHeavy) stance = "분할매수 구간";
    else if (r != null && r > 65 && shortHeavy) stance = "축소 구간";
    else if (longHeavy) stance = "눌림 확인 후 분할매수 검토";
    else if (shortHeavy) stance = "위쪽 추격보다는 축소·관망";

    const used = activeVenues(pack.venues, state.enabled);
    const oiSum = used.reduce(function (s, v) { return s + (v.oiUsd || 0); }, 0);
    const names = used.map(function (v) { return EXCHANGES[v.ex].label; }).join("·") || "없음";
    const src = EXCHANGES[perp.ex] ? EXCHANGES[perp.ex].label : "기준";
    const nowLine = src + " " + (perp.symbol || cfg.coin) + " 기준가 " + fmtPx(price, d) + "달러, 전일(" + fmtPx(perp.prevDayPx, d) + "달러) 대비 " + fmtChg(perp.chg)
      + "예요. 켜 둔 거래소(" + names + ") 미결제약정 합계는 약 " + fmtPx(oiSum, 0) + "달러예요."
      + (sibling ? " 같은 화면의 PAXG는 " + fmtPx(sibling.price, 1) + "달러(" + fmtChg(sibling.chg) + ")예요." : "")
      + (r != null ? " 1시간 RSI는 " + r.toFixed(1) + "예요." : "")
      + " 청산 구간은 각 거래소 미결제약정과 최근 봉으로 나눈 모델 추정이에요.";

    const weaken = longHeavy
      ? "가까운 ±1%에서 롱 청산 우위가 줄거나 숏 쪽으로 바뀌고, 가격이 1차 하락 목표를 이탈했다가 다시 현재가 위로 회복하면 하락 압력이 약해진 걸로 봐요. 펀딩이 마이너스로 돌아서도 숏 과열 신호가 됩니다. 모두 추정이에요."
      : shortHeavy
        ? "가까운 ±1% 숏 우위가 줄고, 1차 상승 목표 근처에서 반응이 나오면 위쪽 힘이 약해질 수 있어요. 모두 추정이에요."
        : "어느 한쪽으로 청산 밀집이 뚜렷해지거나, 1차 하락·상승 목표를 거래량과 함께 벗어나야 방향이 좀 더 분명해져요. 모두 추정이에요.";

    return {
      nowLine: nowLine,
      down: down, up: up, zone: zone, stance: stance,
      buy: fmtPx(buyLo, d) + "~" + fmtPx(buyHi, d) + "달러로 눌리면 분할매수 검토",
      shrink: fmtPx(shrinkPx, d) + "달러 근처는 축소 구간 · " + fmtPx(takePx, d) + "달러 부근은 차익 실현 후보",
      stop: fmtPx(stopPx, d) + "달러를 아래로 깨면 손절 또는 관망",
      weaken: weaken
    };
  }

  function pairUsd(row, side) {
    if (!row) return 0;
    if (typeof row.usd === "number") return side === "long" ? (row.price < 0 ? 0 : row.usd) : row.usd;
    return Array.isArray(row) ? row[1] : (row.usd || 0);
  }
  function pairPx(row) { return Array.isArray(row) ? row[0] : row.price; }
  function pairByEx(row, ex, side) {
    const key = side === "long" ? "longUsd" : "shortUsd";
    return (row.byEx && row.byEx[ex] && row.byEx[ex][key]) || 0;
  }

  function svgMap(D, digits) {
    const p = D.price;
    const RANGE = D.range || RANGE_MIN;
    const longs = D.longs || [], shorts = D.shorts || [];
    const rows = longs.map(function (r) { return { y: pairPx(r), v: r.usd != null ? r.usd : pairUsd(r), side: "long", byEx: r.byEx || {} }; })
      .concat(shorts.map(function (r) { return { y: pairPx(r), v: r.usd != null ? r.usd : pairUsd(r), side: "short", byEx: r.byEx || {} }; }));
    const W = 880, padL = 168, padR = 150, padT = 44, padB = 40;
    const n = Math.max(rows.length, 8);
    const expected = (RANGE * 2) / STEP;
    const rowH = 18;
    const H = padT + padB + Math.max(n, expected) * rowH + 10;
    const yMin = p * (1 - RANGE / 100);
    const yMax = p * (1 + RANGE / 100);
    const yOf = function (px) { return padT + (yMax - px) / (yMax - yMin) * (H - padT - padB); };
    const vmax = Math.max.apply(null, rows.map(function (r) { return r.v; }).concat([1]));
    const maxW = W - padL - padR - 8;
    const minW = Math.max(10, maxW * 0.04);
    const barW = function (v) {
      const raw = (v / vmax) * maxW;
      return v > 0 ? Math.max(raw, minW) : 0;
    };
    const barH = Math.max(12, Math.abs(yOf(p * (1 + STEP / 100)) - yOf(p)) * 0.92);
    const ink = "var(--ink)", muted = "var(--muted)", red = "var(--red)", green = "var(--green)", blue = "var(--blue)";
    let el = "";
    el += '<text x="' + padL + '" y="22" fill="' + green + '" font-size="15" font-weight="700">숏 청산 (오르면 터짐)</text>';
    const usedEx = EX_ORDER.filter(function (ex) {
      return rows.some(function (r) { return pairByEx(r, ex, r.side) > 0; });
    });
    const stackEx = usedEx.length ? usedEx : EX_ORDER.filter(function (ex) { return state.enabled[ex] !== false; });
    rows.forEach(function (r) {
      const w = barW(r.v);
      const y = yOf(r.y) - barH / 2;
      const faint = (r.v / vmax) < 0.04;
      const parts = [];
      let sum = 0;
      stackEx.forEach(function (ex) {
        const u = pairByEx(r, ex, r.side);
        if (u > 0) { parts.push({ ex: ex, u: u }); sum += u; }
      });
      if (!parts.length || !sum) {
        el += '<rect class="liq-bar" data-side="' + r.side + '" data-usd="' + (r.v || 0).toFixed(0) + '" data-px="' + r.y + '" x="' + padL + '" y="' + y.toFixed(2) + '" width="' + w.toFixed(1) + '" height="' + barH.toFixed(2) + '" rx="1.5" fill="' + (r.side === "long" ? red : green) + '" fill-opacity="' + (faint ? "0.38" : "0.9") + '"/>';
        return;
      }
      let x = padL;
      parts.forEach(function (part, i) {
        const pw = w * (part.u / sum);
        const col = EXCHANGES[part.ex].color;
        const rad = (i === 0 && i === parts.length - 1) ? "1.5" : (i === 0 ? "1.5 0 0 1.5" : (i === parts.length - 1 ? "0 1.5 1.5 0" : "0"));
        el += '<rect class="liq-bar" data-ex="' + part.ex + '" data-side="' + r.side + '" data-usd="' + part.u.toFixed(0) + '" data-px="' + r.y + '" x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + Math.max(pw, 0).toFixed(1) + '" height="' + barH.toFixed(2) + '" rx="1.5" fill="' + col + '" fill-opacity="' + (faint ? "0.42" : "0.92") + '"/>';
        x += pw;
      });
    });
    const top = function (side) {
      return side.slice().sort(function (a, b) { return (b.usd != null ? b.usd : pairUsd(b)) - (a.usd != null ? a.usd : pairUsd(a)); })
        .filter(function (r) { return (r.usd != null ? r.usd : pairUsd(r)) > 0; }).slice(0, 3);
    };
    top(longs).concat(top(shorts)).forEach(function (r) {
      const usd = r.usd != null ? r.usd : pairUsd(r);
      const x = padL + barW(usd) + 6;
      const y = yOf(pairPx(r)) + 4;
      el += '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" fill="' + ink + '" font-size="13" font-weight="800">' + man(usd) + '</text>';
    });
    const ticks = rows.map(function (r) { return r.y; }).sort(function (a, b) { return b - a; });
    const use = ticks.length > 16 ? ticks.filter(function (_, i) { return i % 2 === 0; }) : ticks;
    use.forEach(function (y) {
      const pct = (y / p - 1) * 100;
      const label = fmtPx(y, y >= 1000 ? 0 : digits) + "  (" + (pct >= 0 ? "+" : "") + pct.toFixed(1) + "%)";
      el += '<text x="' + (padL - 10) + '" y="' + (yOf(y) + 4) + '" text-anchor="end" fill="' + ink + '" font-size="13">' + label + '</text>';
    });
    const py = yOf(p);
    el += '<line x1="' + padL + '" y1="' + py + '" x2="' + (W - padR + 36) + '" y2="' + py + '" stroke="' + ink + '" stroke-width="3"/>';
    el += '<text x="' + (W - padR + 44) + '" y="' + (py - 8) + '" fill="' + ink + '" font-size="15" font-weight="800">현재가</text>';
    el += '<text x="' + (W - padR + 44) + '" y="' + (py + 12) + '" fill="' + ink + '" font-size="16" font-weight="800">' + fmtPx(p, digits) + '</text>';
    (D.walls || []).forEach(function (w) {
      const wy = yOf(w.price);
      el += '<line x1="' + padL + '" y1="' + wy + '" x2="' + (W - padR) + '" y2="' + wy + '" stroke="' + blue + '" stroke-width="1.5" stroke-dasharray="5 4"/>';
      el += '<text x="' + (W - padR + 8) + '" y="' + (wy - 6) + '" fill="' + blue + '" font-size="11" font-weight="700">' + (w.kind === "bid" ? "매수벽" : "매도벽") + " " + fmtPx(w.price, digits) + '</text>';
      el += '<text x="' + (W - padR + 8) + '" y="' + (wy + 8) + '" fill="' + blue + '" font-size="11">' + man(w.usd) + '</text>';
    });
    el += '<text x="' + padL + '" y="' + (H - 12) + '" fill="' + red + '" font-size="15" font-weight="700">롱 청산 (내리면 터짐)</text>';
    return '<svg id="liq-svg" data-range="' + RANGE + '" data-step="' + STEP + '" data-bins="' + rows.length + '" data-used="' + (D.used || []).join(",") + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="청산맵">' + el + '</svg>';
  }

  function svgPrice(perp, digits) {
    const bars = (perp.candles || []).slice(-48);
    if (bars.length < 4) return "<p>봉 데이터가 부족합니다.</p>";
    const W = 840, H = 160, pL = 58, pR = 16, pT = 16, pB = 24;
    const min = Math.min.apply(null, bars.map(function (b) { return b.l; }));
    const max = Math.max.apply(null, bars.map(function (b) { return b.h; }));
    const x = function (i) { return pL + i / (bars.length - 1) * (W - pL - pR); };
    const y = function (v) { return pT + (max - v) / ((max - min) || 1) * (H - pT - pB); };
    const d = bars.map(function (b, i) { return (i ? "L" : "M") + x(i).toFixed(1) + "," + y(b.c).toFixed(1); }).join(" ");
    const py = y(perp.price);
    let el = "";
    el += '<line x1="' + pL + '" y1="' + py + '" x2="' + (W - pR) + '" y2="' + py + '" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>';
    el += '<path d="' + d + '" fill="none" stroke="var(--ink)" stroke-width="1.8"/>';
    el += '<text x="' + 4 + '" y="' + (pT + 4) + '" fill="var(--muted)" font-size="11">' + fmtPx(max, digits) + '</text>';
    el += '<text x="' + 4 + '" y="' + (H - pB + 4) + '" fill="var(--muted)" font-size="11">' + fmtPx(min, digits) + '</text>';
    el += '<text x="' + (W - pR) + '" y="' + (py - 4) + '" text-anchor="end" fill="var(--ink)" font-size="11" font-weight="700">' + fmtPx(perp.price, digits) + '</text>';

        const pack = state.data[state.tab];

        if (!v || v.status !== "ok") return;

        const still = pack && activeVenues(pack.venues, state.enabled).length;
        if (!still) {
          state.enabled[ex] = true;

      const val = url;
      if (navigator.clipboard && navigator.clipboard.writeText) {

  async function loadOne(key) {
    const cfg = ASSETS[key];
    const errs = [];
    const sibP = cfg.sibling ? loadSibling(cfg).catch(function () { return null; }) : null;
    const results = await Promise.all(EX_ORDER.map(function (ex) { return loadVenue(ex, cfg); }));
    const venues = results;
    const hard = venues.filter(function (v) { return v.status === "fail"; });
    const ok = venues.some(function (v) { return v.status === "ok"; });
    if (!ok) { if (sibP) sibP.catch(function () {}); throw new Error(cfg.tab + " 조회한 거래소 모두에서 시세를 받지 못했어요" + (hard.length ? " (" + hard.map(function (v) { return EXCHANGES[v.ex].label + ": " + (v.error || "실패"); }).join(", ") + ")" : "")); }
    let sibling = null;
    if (sibP) {
      try { sibling = await sibP; } catch (e) { sibling = null; }
    }
    const pack = { venues: venues, sibling: sibling, at: Date.now(), errors: errs };
    rebuildPack(pack);
    return pack;
  }

  const BACKGROUND_MS = 60000;
  function assetKeys() { return Object.keys(ASSETS); }
  function collectErrors() {
    const errs = [];
    assetKeys().forEach(function (key) {
      const pack = state.data[key];
      if (!pack) return;
      (pack.errors || []).forEach(function (e) { errs.push(e); });
    });
    if (state.loadErrors) {
      assetKeys().forEach(function (key) {
        if (state.loadErrors[key]) errs.push(state.loadErrors[key]);
      });
    }
    return errs;
  }
  async function refreshKeys(keys, opts) {
    opts = opts || {};
    keys = (keys || assetKeys()).filter(function (k) { return !state.inflight[k]; });
    if (!keys.length) return;
    keys.forEach(function (k) { state.inflight[k] = true; });
    state.updating = true;
    const stamp = $("stamp");
    const quiet = !!opts.quiet && !!state.data[state.tab];
    if (!quiet) {
      stamp.textContent = "갱신 중…";
      stamp.className = "stamp";
      $("btn-refresh").disabled = true;
    }
    state.loadErrors = state.loadErrors || {};
    try {
      const results = await Promise.allSettled(keys.map(loadOne));
      results.forEach(function (r, i) {
        const key = keys[i];
        if (r.status === "fulfilled") {
          state.data[key] = r.value;
          delete state.loadErrors[key];
        } else {
          state.loadErrors[key] = ASSETS[key].tab + ": " + (r.reason && r.reason.message ? r.reason.message : r.reason);
        }
      });
      state.errors = collectErrors();
      const at = Date.now();
      const ok = Object.keys(state.data).length;
      stamp.textContent = "마지막 갱신 " + fmtKst(at, true) + (ok ? " · " + ok + "개 자산" : "");
      if (state.errors.length && !ok) stamp.className = "stamp err";
      else stamp.className = "stamp";
      render();
    } catch (e) {
      state.errors = [String(e && e.message || e)];
      stamp.textContent = "갱신 실패 · " + fmtKst(Date.now(), true);
      stamp.className = "stamp err";
      render();
    } finally {
      keys.forEach(function (k) { delete state.inflight[k]; });
      state.updating = Object.keys(state.inflight).length > 0;
      $("btn-refresh").disabled = false;
    }
  }
  function refresh() { return refreshKeys([state.tab], { quiet: false }); }
  function refreshVisibleAndStale() {

      document.querySelectorAll(".tabs button").forEach(function (b) { b.classList.toggle("on", b === btn); });
      render();
      const pack = state.data[state.tab];
      if (!pack || !pack.at || (Date.now() - pack.at > REFRESH_MS)) refreshKeys([state.tab], { quiet: !!pack });
    });
  });
  $("btn-refresh").addEventListener("click", function () { refresh(); });
  $("btn-theme").addEventListener("click", function () {
    state.theme = state.theme === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", state.theme === "dark" ? "dark" : "light");
    $("btn-theme").textContent = state.theme === "dark" ? "밝은 화면" : "어두운 화면";
  });

  bootMonetization();
  refresh();
  state.timer = setInterval(refreshVisibleAndStale, REFRESH_MS);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    const pack = state.data[state.tab];
    if (!pack || !pack.at || (Date.now() - pack.at > REFRESH_MS)) refreshVisibleAndStale();
  });
  try { window.__LIQMAP__ = state; } catch (e) {}
})();

</script>
</body>
</html>
